{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oauth2-auth-code-proxy.fullname" . }}-credentials
  labels:
    {{- include "oauth2-auth-code-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.credentials.secretKey }}: {{ .Values.credentials.inline | default "" | b64enc | quote }}
{{- end }}
