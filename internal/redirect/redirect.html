<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #333; line-height: 1.5; }
.container { max-width: 960px; margin: 0 auto; padding: 0 1rem; }
header { border-bottom: 1px solid #e0e0e0; padding: 0.75rem 0; }
main { padding: 2rem 0; }
h3 { font-size: 1.25rem; font-weight: 400; margin-bottom: 1rem; }
a { color: #0076a8; text-decoration: none; }
a:hover { text-decoration: underline; }
footer { margin-top: 3rem; padding: 1rem 0; border-top: 1px solid #e0e0e0; }
footer ul { list-style: none; margin-bottom: 0.5rem; }
footer li { display: inline-block; margin-right: 1rem; font-size: 0.85rem; }
footer p { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
<div class="container">
</div>
</header>
<main>
<div class="container">
<h3>{{.Complete}}</h3>
<h3><a id="redirect-url" href="{{.URL}}">{{.ClickHere}}</a></h3>
</div>
</main>
<footer>
<div class="container">
<nav>
<ul>
<li><a href="https://www.mathworks.com/company/aboutus/policies_statements/trust-center.html">Trust Center</a></li>
<li><a href="https://www.mathworks.com/company/aboutus/policies_statements/trademarks.html">Trademarks</a></li>
<li><a href="https://www.mathworks.com/company/aboutus/policies_statements.html">Privacy Policy</a></li>
<li><a href="https://www.mathworks.com/company/aboutus/policies_statements/piracy.html">Preventing Piracy</a></li>
</ul>
</nav>
<p>&copy; 1994-2026 The MathWorks, Inc.</p>
</div>
</footer>
<script src="redirect.js"></script>
</body>
</html>
